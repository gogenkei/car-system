<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年7月 車費與里程對帳圖表報表</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e9ecef;
      --text-main: #333333;
      --text-muted: #6c757d;
      --accent-color: #2563eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 32px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin-top: 0;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-top: 32px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-card {
      background-color: #f0f7ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .summary-item label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .summary-item .value {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #fafafa;
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    .highlight-column {
      font-weight: bold;
      color: #1e40af;
      background-color: #eff6ff;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      background-color: #e2e8f0;
      color: #475569;
    }

    .footer-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 32px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>2026年7月 車費與里程對帳圖表報表</h1>

  <!-- 月份里程摘要 -->
  <div class="summary-card">
    <div class="summary-item">
      <label>當月總里程</label>
      <div class="value" id="total-mileage-val">0 km</div>
    </div>
    <div class="summary-item">
      <label>Ken 總里程 (比例)</label>
      <div class="value" id="ken-mileage-val">0 km (0%)</div>
    </div>
    <div class="summary-item">
      <label>Terence 總里程 (比例)</label>
      <div class="value" id="terence-mileage-val">0 km (0%)</div>
    </div>
  </div>

  <!-- 里程對帳紀錄表 -->
  <h2>🛣️ 行駛里程紀錄</h2>
  <table>
    <thead>
      <tr>
        <th>駕駛人</th>
        <th>起始里程</th>
        <th>結束里程</th>
        <th class="text-right">小計里程</th>
        <th>記錄時間</th>
      </tr>
    </thead>
    <tbody id="mileage-tbody"></tbody>
  </table>

  <!-- 費用支出與拆帳明細 -->
  <h2>💸 費用支出與拆帳明細記錄</h2>
  <table>
    <thead>
      <tr>
        <th>費用項目</th>
        <th class="text-right">總金額</th>
        <th class="text-center">代墊人</th>
        <th class="text-center">分攤規則</th>
        <th class="text-right highlight-column">Ken 應分擔</th>
        <th>記錄時間</th>
      </tr>
    </thead>
    <tbody id="expense-tbody"></tbody>
  </table>

  <div class="footer-note">
    報表產生時間：2026/8/1 13:30 | https://gogenkei.github.io/car-system/
  </div>
</div>

<script>
  // 1. 原始里程資料
  const mileageLogs = [
    { driver: 'Ken', start: 97021, end: 97553, mileage: 532, time: '2026/7/27 下午5:09:43' },
    { driver: 'Ken', start: 97553, end: 97638, mileage: 85, time: '2026/7/27 下午11:45:31' },
    { driver: 'Terence', start: 97638, end: 97878, mileage: 240, time: '2026/7/28 下午5:56:26' },
    { driver: 'Ken', start: 97878, end: 97970, mileage: 92, time: '2026/7/29 上午8:27:09' },
    { driver: 'Terence', start: 97970, end: 98314, mileage: 344, time: '2026/7/30 下午5:59:28' },
    { driver: 'Ken', start: 98314, end: 98447, mileage: 133, time: '2026/7/31 凌晨1:13:28' },
    { driver: 'Terence', start: 98447, end: 98533, mileage: 86, time: '2026/7/31 下午5:29:15' }
  ];

  // 2. 原始費用資料
  const expenseLogs = [
    { name: '🚗 車貸', amount: 20200, payer: 'Ken', rule: '23_13', time: '2026/7/11 下午8:39:01' },
    { name: '🛡️ 保險', amount: 3656, payer: 'Ken', rule: '23_13', time: '2026/7/11 下午8:39:41' },
    { name: '⚡ 充電', amount: 36, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:40:29' },
    { name: '⚡ 充電', amount: 63, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:40:33' },
    { name: '⚡ 充電', amount: 206, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:40:38' },
    { name: '⚡ 充電', amount: 138, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:40:57' },
    { name: '⚡ 充電', amount: 43, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:41:02' },
    { name: '⚡ 充電', amount: 296, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:41:08' },
    { name: '⚡ 充電', amount: 35, payer: 'Terence', rule: 'month_mileage', time: '2026/7/11 下午8:41:20' },
    { name: '⚡ 充電', amount: 55, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:41:38' },
    { name: '⚡ 充電', amount: 295, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:41:44' },
    { name: '⚡ 充電', amount: 59, payer: 'Terence', rule: 'month_mileage', time: '2026/7/11 下午8:41:58' },
    { name: '⚡ 充電', amount: 15, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:10' },
    { name: '⚡ 充電', amount: 43, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:14' },
    { name: '⚡ 充電', amount: 215, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:20' },
    { name: '⚡ 充電', amount: 266, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:30' },
    { name: '⚡ 充電', amount: 131, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:33' },
    { name: '⚡ 充電', amount: 203, payer: 'Ken', rule: 'month_mileage', time: '2026/7/11 下午8:42:38' }
  ];

  // 計算里程總計與比例
  function getMileageStats() {
    let total = 0;
    let ken = 0;
    let terence = 0;

    mileageLogs.forEach(log => {
      const dist = Number(log.mileage) || 0;
      total += dist;
      if (log.driver.trim().toLowerCase() === 'ken') {
        ken += dist;
      } else {
        terence += dist;
      }
    });

    return { total, ken, terence };
  }

  // 核心拆帳修復邏輯
  function calculateKenShare(expense, stats) {
    const amount = Number(expense.amount) || 0;
    const rule = String(expense.rule || '').trim();

    // 1. 按比例/天數拆帳 (如 "23_13")
    if (rule.includes('_')) {
      const parts = rule.split('_').map(Number);
      const kenRatio = parts[0] || 0;
      const totalRatio = parts.reduce((a, b) => a + b, 0);
      if (totalRatio > 0) {
        return Math.round((amount * kenRatio) / totalRatio);
      }
    }

    // 2. 按當月總里程分攤 ("month_mileage")
    if (rule === 'month_mileage') {
      if (stats.total > 0) {
        return Math.round((amount * stats.ken) / stats.total);
      }
    }

    return 0;
  }

  // 渲染畫面
  function render() {
    const stats = getMileageStats();

    // 更新頂部卡片
    const kenPct = stats.total > 0 ? ((stats.ken / stats.total) * 100).toFixed(1) : 0;
    const terencePct = stats.total > 0 ? ((stats.terence / stats.total) * 100).toFixed(1) : 0;

    document.getElementById('total-mileage-val').innerText = `${stats.total.toLocaleString()} km`;
    document.getElementById('ken-mileage-val').innerText = `${stats.ken.toLocaleString()} km (${kenPct}%)`;
    document.getElementById('terence-mileage-val').innerText = `${stats.terence.toLocaleString()} km (${terencePct}%)`;

    // 渲染里程表格
    const mileageTbody = document.getElementById('mileage-tbody');
    mileageTbody.innerHTML = mileageLogs.map(log => `
      <tr>
        <td><strong>${log.driver}</strong></td>
        <td>${log.start}</td>
        <td>${log.end}</td>
        <td class="text-right"><strong>${log.mileage} km</strong></td>
        <td>${log.time}</td>
      </tr>
    `).join('');

    // 渲染費用表格（含修復後的金額計算）
    const expenseTbody = document.getElementById('expense-tbody');
    expenseTbody.innerHTML = expenseLogs.map(exp => {
      const kenShare = calculateKenShare(exp, stats);
      return `
        <tr>
          <td>${exp.name}</td>
          <td class="text-right">$${exp.amount.toLocaleString()}</td>
          <td class="text-center">${exp.payer}</td>
          <td class="text-center"><span class="badge">${exp.rule}</span></td>
          <td class="text-right highlight-column">$${kenShare.toLocaleString()}</td>
          <td>${exp.time}</td>
        </tr>
      `;
    }).join('');
  }

  // 頁面載入後自動執行渲染
  window.onload = render;
</script>

</body>
</html>
